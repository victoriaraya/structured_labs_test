[project]
title = "Victoria's Project"
version = "0.1.0"
port = 8501
slug = "victoria-project"  # Required: Unique identifier for your project
entrypoint = "hello.py"    # Required: Main script to run when executing preswald run

[branding]
name = "Fruit Prices"
logo = "images/logo.png"
favicon = "data/favicon.ico"
primaryColor = "#FFD6DD"

[data.fruit_prices]
type = "csv"
path = "data/Fruit-Prices.csv"

[logging]
level = "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"